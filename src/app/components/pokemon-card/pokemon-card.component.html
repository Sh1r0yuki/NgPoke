<mat-card appearance="outlined">
    <mat-card-header>
        <mat-card-title>
            {{name}}
            <button mat-icon-button (click)="onAddFavorite.emit()">
                <mat-icon [style]="{opacity: isIconActive ? 1 : .2}">favorite</mat-icon>
            </button>
        </mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <img [src]="imageUrl" />
    </mat-card-content>
    <mat-card-actions>
        <button mat-button [routerLink]="'/pokemon-details/' + id">Détails</button>
    </mat-card-actions>
</mat-card>
